name: Sondage des sources de manifs

# Teste les adresses des agendas (Demosphere, Paris-luttes.info, Mobilizon) et du géocodeur,
# puis publie le rapport sur la branche « sondes ».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/probe-sources.js', 'scripts/probe-route.js', 'lib/importers/**', 'lib/route.js', 'lib/geocode.js', 'config/sources.json']

permissions:
  contents: write

jobs:
  sondes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: mkdir -p sortie && node scripts/probe-sources.js sortie/rapport.txt
      - name: Tracé automatique (géocodage et itinéraire réels)
        run: node scripts/probe-route.js | tee sortie/trace.txt
      - name: Import réel (sans écriture)
        run: node scripts/import-events.js --dry-run > sortie/import.txt 2>&1 || true
      - name: Publication sur la branche « sondes »
        run: |
          cd sortie
          git init -q -b sondes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Sondes $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" sondes
